name: Pylint Code Quality Check

on:
  pull_request:
    branches: [beta]
  push:
    branches: [beta]
  workflow_dispatch:

jobs:
  pylint:
    runs-on: ubuntu-latest
    name: Pylint Code Quality Check

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.in', '**/requirements-dev.in', '**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python -m pip install --upgrade pip setuptools wheel
        gh release download "v0.2.9+neo.5" -R 4Nest/MoviePilot-Rust -p "*cp311*manylinux_2_17_x86_64*.whl" -D /tmp/wheels --clobber
        pip install --no-index --find-links /tmp/wheels moviepilot-rust==0.2.9+neo.5
        # Pylint 属于开发/静态检查依赖，统一通过 dev 入口安装。
        pip install -r requirements-dev.in
    - name: Run high-confidence checks
      run: pylint app/ --score=no
