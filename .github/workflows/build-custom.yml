name: Build moviepilot-neo Image

on:
  # 每次合并/推送到 neo 都构建并覆盖 ghcr.io/4nest/moviepilot-neo:latest
  push:
    branches:
      - neo
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# latest 标签会被覆盖，串行构建避免并发推送乱序；不回滚 latest，回滚靠记录的 digest
concurrency:
  group: ghcr-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push GHCR Image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与官方 build.yml 一致：稀疏检出 Wiki 的 plugin.md，生成默认插件市场配置
      - name: Checkout Wiki Plugin Market
        uses: actions/checkout@v4
        with:
          repository: jxxghp/MoviePilot-Wiki
          ref: main
          path: .build/moviepilot-wiki
          sparse-checkout: plugin.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Generate Plugin Market Default
        run: |
          python3 -m scripts.generate_plugin_market_default \
            --wiki-file .build/moviepilot-wiki/plugin.md \
            --config-file app/core/config.py

      # Unraid 主机为 x86，仅构建 linux/amd64，runner 原生架构无需 QEMU
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          # 前端 Release 资产可在同一版本标签下被替换；run_id 保证每次镜像构建重新下载当前 dist.zip。
          build-args: |
            FRONTEND_REPO=4Nest/moviepilot-neo-frontend
            FRONTEND_DIST_TAG=${{ github.run_id }}-${{ github.run_attempt }}
          platforms: linux/amd64
          push: true
          # GHCR 要求全小写命名空间（4Nest -> 4nest）；固定 latest，不派生版本/edge 标签
          tags: ghcr.io/4nest/moviepilot-neo:latest
          labels: |
            org.opencontainers.image.source=https://github.com/4Nest/moviepilot-neo
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=MoviePilot personal fork (moviepilot-neo), based on upstream v2
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha,scope=moviepilot-neo-docker
          cache-to: type=gha,scope=moviepilot-neo-docker,mode=max
