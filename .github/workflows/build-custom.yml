name: Build moviepilot-neo Image

on:
  # neo 分支构建开发镜像；v* 标签构建正式版本；手动运行可选择发布 latest
  push:
    branches:
      - neo
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_latest:
        description: '将本次构建同时发布为 latest（仅稳定代码使用）'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  FRONTEND_REPO: 4Nest/moviepilot-neo-frontend

# 同一 ref 串行构建，避免并发推送造成标签乱序；正式镜像通过版本标签发布
concurrency:
  group: ghcr-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Tests and Static Checks
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.in
      - name: Run tests
        run: python -m pytest tests -q
      - name: Run high-confidence static checks
        run: pylint app/ --score=no

  build:
    needs: quality
    runs-on: ubuntu-latest
    name: Build and Push GHCR Image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与官方 build.yml 一致：稀疏检出 Wiki 的 plugin.md，生成默认插件市场配置
      - name: Checkout Wiki Plugin Market
        uses: actions/checkout@v4
        with:
          repository: jxxghp/MoviePilot-Wiki
          ref: main
          path: .build/moviepilot-wiki
          sparse-checkout: plugin.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Generate Plugin Market Default
        run: |
          python3 -m scripts.generate_plugin_market_default \
            --wiki-file .build/moviepilot-wiki/plugin.md \
            --config-file app/core/config.py


      - name: Resolve immutable frontend asset
        id: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          frontend_version=$(sed -n "s/^FRONTEND_VERSION\s*=\s*'\([^']*\)'/\1/p" version.py)
          frontend_sha=$(gh api "repos/${FRONTEND_REPO}/commits/neo" --jq '.sha')
          frontend_asset="dist-${frontend_sha}.zip"
          frontend_asset_url="https://github.com/${FRONTEND_REPO}/releases/download/${frontend_version}/${frontend_asset}"
          for attempt in $(seq 1 60); do
            if curl -fsSIL "$frontend_asset_url" >/dev/null; then
              echo "sha=$frontend_sha" >> "$GITHUB_OUTPUT"
              echo "asset=$frontend_asset" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for frontend asset ${frontend_asset} (${attempt}/60)"
            sleep 10
          done
          echo "Frontend asset was not published: ${frontend_asset_url}" >&2
          exit 1

      - name: Resolve build identity
        id: identity
        run: |
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            channel="release"
          elif [[ "${{ inputs.publish_latest }}" == "true" ]]; then
            channel="latest"
          else
            channel="neo"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # Unraid 主机为 x86，仅构建 linux/amd64，runner 原生架构无需 QEMU
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/4nest/moviepilot-neo
          tags: |
            type=raw,value=neo,enable=${{ github.ref == 'refs/heads/neo' && inputs.publish_latest != true }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_latest == true }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          # 每个镜像绑定一个精确前端 commit 的不可变 Release 资产。
          build-args: |
            FRONTEND_REPO=${{ env.FRONTEND_REPO }}
            FRONTEND_DIST_ASSET=${{ steps.frontend.outputs.asset }}
            FRONTEND_DIST_TAG=${{ steps.frontend.outputs.sha }}
            BACKEND_BUILD_SHA=${{ github.sha }}
            FRONTEND_BUILD_SHA=${{ steps.frontend.outputs.sha }}
            BUILD_CHANNEL=${{ steps.identity.outputs.channel }}
            BUILD_TIME=${{ steps.identity.outputs.built_at }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/4Nest/moviepilot-neo
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=MoviePilot personal fork (moviepilot-neo), based on upstream v2
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha,scope=moviepilot-neo-docker
          cache-to: type=gha,scope=moviepilot-neo-docker,mode=max
